# v10 B3 (docs/v10_experiment_log.md Sec.5.22): copy of default.yml; only the
# probe-Q critic (B1 seed0 A-1 critic) and its normalisation statistics
# (computed on v10_swapmix_r2 train, all frames x 8 probes) differ.
input:
    vision: &input_vision
        channel: 3
        width: 64
        height: 16
    motion: &probe_k 8

probe_q:
    k: 8
    mu: 2.124917
    sigma: 0.787905
    critic_path: /work/my_research/preference_inference/data/model/v10/v10_rl_critic_seed0.pth

vision_encoder_module:
    input: *input_vision
    conv:
        - ch: 16
          kernel_size: [3, 10]
          stride: 2
          padding: 1
        - ch: 32
          kernel_size: [3, 10]
          stride: 2
          padding: 1
        - ch: 64
          kernel_size: [3, 10]
          stride: 2
          padding: 1
    fc:
        - input: ~
          output: &enc_out 64

superposition_module:
    input:
        motion: *probe_k
        vision: *enc_out
    hidden: &sp_hidden 128

integration_module:
    fc:
        each_input: *sp_hidden
        output: *enc_out

feature_prediction_module:
    fc:
        - input: *sp_hidden
          output: 128
        - input: 128
          output: *enc_out

vision_decoder_module:
    fc:
        - input: *enc_out
          output: ~
    conv:
        - ch: 32
          kernel_size: [4, 10]
          stride: 2
          padding: 1
        - ch: 16
          kernel_size: [4, 12]
          stride: 2
          padding: 1
        - ch: 3
          kernel_size: [4, 12]
          stride: 2
          padding: 1
