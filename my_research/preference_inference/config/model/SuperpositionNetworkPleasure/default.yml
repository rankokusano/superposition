# v11 stage 1 (docs/v11_experiment_log.md Sec.4.4): process-1 input = 8-dim
# innate pleasure (liked - disliked pixels per camera bin / 128, scale c = 1),
# process-2 = zeros(8). Everything else = the paper's
# SuperpositionNetworkFeaturePrediction default.
input:
    vision: &input_vision
        channel: 3
        width: 64
        height: 16
    motion: &pleasure_dim 8

pleasure:
    liked: Red
    disliked: Green
    scale: 1.0

vision_encoder_module:
    input: *input_vision
    conv:
        - ch: 16
          kernel_size: [3, 10]
          stride: 2
          padding: 1
        - ch: 32
          kernel_size: [3, 10]
          stride: 2
          padding: 1
        - ch: 64
          kernel_size: [3, 10]
          stride: 2
          padding: 1
    fc:
        - input: ~
          output: &enc_out 64

superposition_module:
    input:
        motion: *pleasure_dim
        vision: *enc_out
    hidden: &sp_hidden 128

integration_module:
    fc:
        each_input: *sp_hidden
        output: *enc_out

feature_prediction_module:
    fc:
        - input: *sp_hidden
          output: 128
        - input: 128
          output: *enc_out

vision_decoder_module:
    fc:
        - input: *enc_out
          output: ~
    conv:
        - ch: 32
          kernel_size: [4, 10]
          stride: 2
          padding: 1
        - ch: 16
          kernel_size: [4, 12]
          stride: 2
          padding: 1
        - ch: 3
          kernel_size: [4, 12]
          stride: 2
          padding: 1
