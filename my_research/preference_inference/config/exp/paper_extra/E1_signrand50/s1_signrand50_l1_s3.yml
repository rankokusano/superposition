# Paper round 11 E1, l1 stage: v12_s1_mixed_l1_s3.yml with the signed-pleasure model, data paper_s1_mixed50_signrand and
# pretrain = paper_extra/E1_signrand50/s1_signrand50_mse (same seed) ep200. Decoder only. Run with analyze/paper_extra/train_paper_e1.py --seed 3.
model:
    name: SuperpositionNetworkMotionPleasureHoldSigned
    config: default
    mode: ~
runner: PredictionFeaturePredictionRunner
data:
    name: paper_s1_mixed50_signrand
load_state_dict_strict: False
p_mask_vision: 0.99
train:
    loss_function: l1_loss
    pretrain:
        exp_config: paper_extra/E1_signrand50/s1_signrand50_mse
        seed: 3
        epoch: 200
    batch_size: 10
    max_epochs: 200
    save_interval: 10
    test_interval: 10
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.001
            weight_decay: 0.01
        freeze:
            - superposition_module
            - vision_encoder_module
            - integration_module
            - share_lns
            - feature_prediction_module
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
