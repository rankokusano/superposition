# v11 stage 2 (docs/v11_experiment_log.md Sec.7.42): copy of the paper's exp3_1000.yml with only the model name,
# data name and pretrain (exp_config/seed; run with --seed 0) changed.
model:
  name: SuperpositionNetworkPleasureOther
  config: default
  mode: ~
runner: MotionGenerationPredictionFeaturePredictionRunner
data:
  name: v11_s2_green
load_state_dict_strict: False
train:
  loss_function: l1_loss
  pretrain:
    exp_config: v11_s1_random_l1_s0
    seed: 0
    epoch: 200
  batch_size: 10
  max_epochs: 200
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - superposition_module
      - vision_encoder_module
      - vision_decoder_module
      - integration_module
      - share_lns
      - feature_prediction_module
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
