# v15 Sec.15 extra: v15_s1_plain_fig5_mse150.yml with pretrain = v15_s1_colourl1_mse seed 0 ep150. --seed 0.
model:
    name: Autoencoder
    config: default
    mode: ~
runner: AutoencoderRunner
data:
    name: v15_s1_p80_half_first1000
load_state_dict_strict: False
train:
    loss_function: l1_loss
    pretrain:
        exp_config: v15_s1_colourl1_mse
        seed: 0
        epoch: 150
    batch_size: 100
    max_epochs: 100
    save_interval: 1
    test_interval: 100
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.001
            weight_decay: 3.
        freeze:
            - vision_encoder
            - share_lns
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
