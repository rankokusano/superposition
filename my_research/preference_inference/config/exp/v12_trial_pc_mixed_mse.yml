# v12 trial (P-c) (docs/v12_experiment_log.md Sec.10): v12_trial_pb_mixed_mse.yml with the hold-pleasure model.
# v11 stage 1 (docs/v11_experiment_log.md Sec.4.11, 5.3): copy of the paper's exp1_mse_1000.yml
# with only the model name and data name changed.
model:
  name: SuperpositionNetworkMotionPleasureHold
  config: default
  mode: ~
runner: PredictionFeaturePredictionRunner
data:
  name: v11_s1_mixed_first1000
load_state_dict_strict: False
p_mask_vision: 0.99
train:
  loss_function: mse_loss
  pretrain: ~
  pretrain_encoder_from: /work/data/result/exp1_l1_1000/0/model/00200.pth
  batch_size: 10
  max_epochs: 150
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - vision_encoder
      - share_lns
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
      - name: vision_encoder
        args:
          weight_decay: 0.001
      - name: share_lns
        args:
          weight_decay: 0.001
