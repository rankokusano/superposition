model:
    name: SuperpositionNetworkApproachBMGVEV3
    config: default
    mode: ~
runner: ApproachBMGVEV3Runner
data:
    name: v3_b_mgve_train
load_state_dict_strict: False
train:
    loss_function: l1_loss
    pretrain:
        exp_config: v3_exp_b_base_l1
        seed: 0
        epoch: 200
    batch_size: 10
    max_epochs: 200
    save_interval: 10
    test_interval: 10
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.001
            weight_decay: 0.01
        freeze:
            - superposition_module
            - vision_encoder_module
            - vision_decoder_module
            - integration_module
            - feature_prediction_module
            - share_lns
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
