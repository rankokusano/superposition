# R3-curriculum stage b: process-1 input = concat([action, probe-Q]),
# action_dropout_rate=0.0 (action always present, Q added alongside).
# SM's input width changes 2 -> 10 vs stage a, so its weights are NOT
# shape-compatible with a's checkpoint (util.load_pretrain skips the
# mismatched key and trains SM from scratch here); vision/decoder/
# integration/FPM still transfer unchanged.
model:
    name: SuperpositionNetworkProbeQConcat
    config: r3b
    mode: ~
runner: PredictionFeaturePredictionRunner
data:
    name: r2_a1random_a2rl
load_state_dict_strict: False
p_mask_vision: 0.99
train:
    loss_function: l1_loss
    pretrain:
        exp_config: r3_curriculum_a
        seed: 0
        epoch: 200
    batch_size: 10
    max_epochs: 200
    save_interval: 10
    test_interval: 10
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.001
            weight_decay: 0.01
        freeze:
            - vision_encoder_module
            - vision_decoder_module
            - integration_module
            - feature_prediction_module
            - share_lns
            - probe_critic
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
