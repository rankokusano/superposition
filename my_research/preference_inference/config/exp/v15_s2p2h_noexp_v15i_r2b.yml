# v15 Sec.41 R2b: v15_s2p2h_noexp_v15i_r2.yml with the start checkpoint v15_s2p1_noexp_v15i_r2b (analyze/v15/make_r2b_v15.py: the same-seed NS noexp phase 1 with the other side's 11 input columns = the NS values times the R1b constant, so that their norm equals the shared trained 11 columns). Run with --seed 0.
model:
  name: SuperpositionNetworkMotionPleasureHoldOtherV15NS
  config: default
  mode: ~
runner: MotionGenerationPredictionFeaturePredictionRunner
data:
  name: v15_s2_c2_p80_half_1000t_hideA2
  input_vision: self_vision_in
load_state_dict_strict: False
train:
  loss_function: l1_loss
  pretrain:
    exp_config: v15_s2p1_noexp_v15i_r2b
    seed: 0
    epoch: 150
  batch_size: 10
  max_epochs: 150
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - superposition_module
      - vision_encoder_module
      - vision_decoder_module
      - integration_module
      - share_lns
      - feature_prediction_module
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
