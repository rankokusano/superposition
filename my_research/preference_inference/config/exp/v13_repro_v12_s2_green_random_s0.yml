# v13 preparation (docs/v13_experiment_log.md Sec.3.6, 12): v12_s2_green_random_s0.yml cut to 10 epochs, to check that the current code reproduces the v12 stage-2 no-experience run (compare ep0 and ep10 with v12_s2_green_random_s0/0/model). Not a result.
model:
  name: SuperpositionNetworkMotionPleasureHoldOther
  config: default
  mode: ~
runner: MotionGenerationPredictionFeaturePredictionRunner
data:
  name: v11_s2_green
load_state_dict_strict: False
train:
  loss_function: l1_loss
  pretrain:
    exp_config: v12_s1_random_l1_s0
    seed: 0
    epoch: 200
  batch_size: 10
  max_epochs: 10
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - superposition_module
      - vision_encoder_module
      - vision_decoder_module
      - integration_module
      - share_lns
      - feature_prediction_module
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
