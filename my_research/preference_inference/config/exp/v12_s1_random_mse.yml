# v12 stage 1 main (docs/v12_experiment_log.md Sec.11, 13): v12_trial_pc_random_mse.yml on the full v11_s1_random (train 3000) for 200 ep, saved every epoch (as v11_s1_random_mse). Seeds 0-2 by --seed.
# v11 stage 1 (docs/v11_experiment_log.md Sec.4.11, 5.3): copy of the paper's exp1_mse_1000.yml
# with only the model name and data name changed.
model:
  name: SuperpositionNetworkMotionPleasureHold
  config: default
  mode: ~
runner: PredictionFeaturePredictionRunner
data:
  name: v11_s1_random
load_state_dict_strict: False
p_mask_vision: 0.99
train:
  loss_function: mse_loss
  pretrain: ~
  pretrain_encoder_from: /work/data/result/exp1_l1_1000/0/model/00200.pth
  batch_size: 10
  max_epochs: 200
  save_interval: 1
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - vision_encoder
      - share_lns
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
      - name: vision_encoder
        args:
          weight_decay: 0.001
      - name: share_lns
        args:
          weight_decay: 0.001
