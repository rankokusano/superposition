# v12 trial (docs/v12_experiment_log.md Sec.4): v11_trial_random_mse.yml with the v12 model, 150 epochs, saved every 10.
# v11 stage 1 (docs/v11_experiment_log.md Sec.4.11, 5.3): copy of the paper's exp1_mse_1000.yml
# with only the model name and data name changed.
model:
  name: SuperpositionNetworkMotionPleasure
  config: default
  mode: ~
runner: PredictionFeaturePredictionRunner
data:
  name: v11_s1_random_first1000
load_state_dict_strict: False
p_mask_vision: 0.99
train:
  loss_function: mse_loss
  pretrain: ~
  batch_size: 10
  max_epochs: 150
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze: ~
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
      - name: vision_encoder
        args:
          weight_decay: 0.001
      - name: share_lns
        args:
          weight_decay: 0.001
