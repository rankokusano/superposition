# v14-C stage 1 (docs/v14_experiment_log.md Sec.5, 13): v12_s1_mixed_mse.yml with the data changed to v14_s1_mixedpref (A-1's liked colour
# Red/Green per episode) and the signed-pleasure model (P = liked - disliked). Run with train_v14.py. Seeds 0-2 by --seed.
# v11 stage 1 (docs/v11_experiment_log.md Sec.4.11, 5.3): copy of the paper's exp1_mse_1000.yml
# with only the model name and data name changed.
model:
  name: SuperpositionNetworkMotionPleasureHoldSigned
  config: default
  mode: ~
runner: PredictionFeaturePredictionRunner
data:
  name: v14_s1_mixedpref
load_state_dict_strict: False
p_mask_vision: 0.99
train:
  loss_function: mse_loss
  pretrain: ~
  pretrain_encoder_from: /work/data/result/exp1_l1_1000/0/model/00200.pth
  batch_size: 10
  max_epochs: 200
  save_interval: 1
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - vision_encoder
      - share_lns
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
      - name: vision_encoder
        args:
          weight_decay: 0.001
      - name: share_lns
        args:
          weight_decay: 0.001
