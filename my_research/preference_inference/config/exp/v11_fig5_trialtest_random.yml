# v11 Fig.5 Decoder (docs/v11_experiment_log.md Sec.4.13, 7.18): copy of fig5_v4_exp1l1000.yml; data = v11_s1_random train first 1000 (both conditions), pretrain = v11_s1_mixed_l1_s0 ep200. Run with --seed 0.
model:
    name: Autoencoder
    config: default
    mode: ~
runner: AutoencoderRunner
data:
    name: v11_s1_random_first1000
load_state_dict_strict: False
train:
    loss_function: l1_loss
    pretrain:
        exp_config: v11_trial_random_mse_cont150
        seed: 0
        epoch: 150
    batch_size: 100
    max_epochs: 2
    save_interval: 1
    test_interval: 100
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.001
            weight_decay: 3.
        freeze:
            - vision_encoder
            - share_lns
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
