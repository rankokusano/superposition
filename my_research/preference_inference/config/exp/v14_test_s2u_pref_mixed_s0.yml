# v14-B dry run (docs/v14_experiment_log.md Sec.14): v14_s2u_pref_mixed_s0.yml with 2 epochs; not a result.
model:
  name: SuperpositionNetworkMotionPleasureHoldOtherOneBit
  config: onebit
  mode: ~
runner: MotionGenerationPredictionFeaturePredictionRunner
data:
  name: v11_s2_pref
load_state_dict_strict: False
train:
  loss_function: l1_loss
  pretrain:
    exp_config: v12_s1_mixed_l1_s0
    seed: 0
    epoch: 200
  batch_size: 10
  max_epochs: 2
  save_interval: 1
  test_interval: 1
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - superposition_module
      - vision_encoder_module
      - vision_decoder_module
      - integration_module
      - share_lns
      - feature_prediction_module
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
