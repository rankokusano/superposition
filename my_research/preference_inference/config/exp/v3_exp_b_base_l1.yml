model:
    name: SuperpositionNetworkApproachBBaseV3
    config: default
    mode: ~
runner: ApproachBBaseV3Runner
data:
    name: v3_b_base_train
load_state_dict_strict: False
p_mask_vision: 0.99
train:
    loss_function: l1_loss
    pretrain:
        exp_config: v3_exp_b_base_mse
        seed: 0
        epoch: 200
    batch_size: 10
    max_epochs: 200
    save_interval: 10
    test_interval: 10
    optimizer: AdamW
    optim_config:
        default:
            lr: 0.0003
            weight_decay: 0.01
        freeze:
            - superposition_module
            - vision_encoder_module
            - integration_module
            - feature_prediction_module
            - share_lns
        per_params:
            - name: bias
              args:
                  weight_decay: 0.0
            - name: vision_encoder
              args:
                  weight_decay: 0.001
            - name: share_lns
              args:
                  weight_decay: 0.001
