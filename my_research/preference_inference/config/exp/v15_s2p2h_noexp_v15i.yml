# v15 2(b) (docs/v15_experiment_log.md Sec.24.5, exploratory): v15_s2p2_noexp_v15i.yml with A-2 hidden in the INPUT view
# (data v15_s2_c2_p80_half_1000t_hideA2, input_vision self_vision_in; target unchanged). pretrain = v15_s2p1_noexp_v15i_mse ep150; l1 150 ep. --seed 0.
model:
  name: SuperpositionNetworkMotionPleasureHoldOtherV15
  config: default
  mode: ~
runner: MotionGenerationPredictionFeaturePredictionRunner
data:
  name: v15_s2_c2_p80_half_1000t_hideA2
  input_vision: self_vision_in
load_state_dict_strict: False
train:
  loss_function: l1_loss
  pretrain:
    exp_config: v15_s2p1_noexp_v15i_mse
    seed: 0
    epoch: 150
  batch_size: 10
  max_epochs: 150
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze:
      - superposition_module
      - vision_encoder_module
      - vision_decoder_module
      - integration_module
      - share_lns
      - feature_prediction_module
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
