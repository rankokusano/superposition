# v12 E2 (Sec.53, post-hoc check, NOT a thesis result): v12_s1_mixed_mse.yml (motion + pleasure + hidden flag, motion hidden in
# intervals, pleasure held) with the encoders learned FROM SCRATCH (no pretrain_encoder_from, nothing frozen), mse 200 ep. --seed 0.
model:
  name: SuperpositionNetworkMotionPleasureHold
  config: default
  mode: ~
runner: PredictionFeaturePredictionRunner
data:
  name: v11_s1_mixed
load_state_dict_strict: False
p_mask_vision: 0.99
train:
  loss_function: mse_loss
  pretrain: ~
  batch_size: 10
  max_epochs: 200
  save_interval: 10
  test_interval: 10
  optimizer: AdamW
  optim_config:
    default:
      lr: 0.001
      weight_decay: 0.01
    freeze: ~
    per_params:
      - name: bias
        args:
          weight_decay: 0.0
      - name: vision_encoder
        args:
          weight_decay: 0.001
      - name: share_lns
        args:
          weight_decay: 0.001
