<text x="20" y="724" text-anchor="start" font-size="12" fill="#333" font-weight="normal">Fig.5：Encoder-1 → Decoder の Autoencoder を学習し、Encoder-2 の出力を同じ Decoder に通して「A-2 から見た視界」を取り出す。</text>
