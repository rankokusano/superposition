<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 545" width="980" height="545" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="545" fill="#ffffff"/>
  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">元論文（Noguchi et al., 2022）の重ね合わせのネットワーク</text>
  <text x="490" y="44" text-anchor="middle" font-size="12" fill="#555">予測の対象は「A-1 自身の次の視界」だけ。A-2 は A-1 の視界の中に黒い立方体として映るだけで、A-2 の視界はネットワークに入らない</text>

  <!-- input view -->
  <rect x="16" y="215" width="150" height="62" rx="8" fill="#f2f2f2" stroke="#333"/>
  <text x="91" y="241" text-anchor="middle" fill="#111">A-1 の視界 v_t</text>
  <text x="91" y="260" text-anchor="middle" font-size="11" fill="#555">16×64 の全方位画像</text>

  <!-- encoders -->
  <rect x="215" y="110" width="130" height="50" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="280" y="132" text-anchor="middle" fill="#111">Encoder-1</text>
  <text x="280" y="149" text-anchor="middle" font-size="11" fill="#555">（自己用）</text>
  <rect x="215" y="330" width="130" height="50" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="280" y="352" text-anchor="middle" fill="#111">Encoder-2</text>
  <text x="280" y="369" text-anchor="middle" font-size="11" fill="#555">（他者用）</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#555">同じ作り・別の重み</text>
  <text x="280" y="265" text-anchor="middle" font-size="11" fill="#555">どちらも A-1 の視界を読む</text>
  <line x1="166" y1="236" x2="214" y2="140" stroke="#333" marker-end="url(#ar)"/>
  <line x1="166" y1="256" x2="214" y2="352" stroke="#333" marker-end="url(#ar)"/>

  <!-- shared module group -->
  <rect x="400" y="70" width="230" height="350" rx="10" fill="none" stroke="#1f5f9f" stroke-dasharray="6 4"/>
  <text x="515" y="238" text-anchor="middle" font-size="12" fill="#1f5f9f">共有モジュール（LSTM 128）</text>
  <text x="515" y="256" text-anchor="middle" font-size="11" fill="#1f5f9f">重みは共通・記憶（内部状態）は別</text>
  <rect x="425" y="115" width="180" height="60" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="515" y="140" text-anchor="middle" fill="#111">process-1（自己）</text>
  <text x="515" y="160" text-anchor="middle" font-size="12" fill="#333">内部状態 h¹</text>
  <rect x="425" y="320" width="180" height="60" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="515" y="345" text-anchor="middle" fill="#111">process-2（他者）</text>
  <text x="515" y="365" text-anchor="middle" font-size="12" fill="#333">内部状態 h²</text>

  <!-- masked encoder outputs -->
  <line x1="345" y1="135" x2="424" y2="140" stroke="#333" marker-end="url(#ar)"/>
  <text x="384" y="126" text-anchor="middle" font-size="11" fill="#b3261e">マスク</text>
  <line x1="345" y1="355" x2="424" y2="350" stroke="#333" marker-end="url(#ar)"/>
  <text x="384" y="346" text-anchor="middle" font-size="11" fill="#b3261e">マスク</text>
  <text x="366" y="225" text-anchor="middle" font-size="11" fill="#b3261e">学習中は 99% の</text>
  <text x="366" y="240" text-anchor="middle" font-size="11" fill="#b3261e">確率で零にする</text>

  <!-- motion input (top) -->
  <line x1="515" y1="50" x2="515" y2="114" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="525" y="64" font-size="12" fill="#b3261e">自分の運動 m_t（2 次元）</text>

  <!-- process-2 input (bottom) -->
  <line x1="515" y1="495" x2="515" y2="381" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="525" y="514" font-size="12" fill="#b3261e">exp1：零ベクトル</text>
  <text x="525" y="531" font-size="12" fill="#b3261e">exp3：Motion Generator が作った A-2 の運動</text>

  <!-- MG -->
  <rect x="215" y="440" width="150" height="50" rx="8" fill="#fde2c4" stroke="#333"/>
  <text x="290" y="461" text-anchor="middle" fill="#111">Motion Generator</text>
  <text x="290" y="478" text-anchor="middle" font-size="11" fill="#555">（exp3 でこれだけ学習）</text>
  <line x1="260" y1="381" x2="275" y2="439" stroke="#333" marker-end="url(#ar)"/>
  <text x="200" y="415" font-size="11" fill="#555">マスク前の出力</text>
  <polyline points="365,465 470,465 508,410" fill="none" stroke="#333" marker-end="url(#ar)"/>

  <!-- integration, decoder -->
  <rect x="670" y="220" width="110" height="52" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="725" y="251" text-anchor="middle" fill="#111">統合部</text>
  <line x1="605" y1="150" x2="670" y2="232" stroke="#333" marker-end="url(#ar)"/>
  <line x1="605" y1="350" x2="670" y2="262" stroke="#333" marker-end="url(#ar)"/>
  <rect x="815" y="220" width="110" height="52" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="870" y="251" text-anchor="middle" fill="#111">Decoder</text>
  <line x1="780" y1="246" x2="814" y2="246" stroke="#333" marker-end="url(#ar)"/>
  <rect x="800" y="300" width="140" height="44" rx="8" fill="#f2f2f2" stroke="#333"/>
  <text x="870" y="327" text-anchor="middle" fill="#111">予測 v_{t+1}</text>
  <line x1="870" y1="272" x2="870" y2="299" stroke="#333" marker-end="url(#ar)"/>

  <!-- feature prediction -->
  <rect x="660" y="110" width="150" height="50" rx="8" fill="#dbe8f5" stroke="#333"/>
  <text x="735" y="131" text-anchor="middle" fill="#111">特徴予測部</text>
  <text x="735" y="148" text-anchor="middle" font-size="11" fill="#555">次の Encoder 出力を予測</text>
  <line x1="605" y1="135" x2="659" y2="135" stroke="#333" marker-end="url(#ar)"/>

  <!-- legend -->
  <rect x="660" y="390" width="18" height="14" fill="#dbe8f5" stroke="#333"/>
  <text x="684" y="402" font-size="12" fill="#333">exp1 で全体を学習（A-2 は静止）</text>
  <rect x="660" y="414" width="18" height="14" fill="#fde2c4" stroke="#333"/>
  <text x="684" y="426" font-size="12" fill="#333">exp3 で他者用の部品だけ学習（ほかは凍結）</text>
  <text x="660" y="452" font-size="12" fill="#333">Fig.5（exp2）：Encoder-1 → Decoder を学習し、</text>
  <text x="660" y="468" font-size="12" fill="#333">Encoder-2 の出力を同じ Decoder に通すと</text>
  <text x="660" y="484" font-size="12" fill="#333">「A-2 から見た視界」が取り出せる</text>
</svg>
